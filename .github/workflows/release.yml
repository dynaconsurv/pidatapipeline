name: Package & Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Release Package
        run: python package_release.py --version ${{ steps.get_version.outputs.VERSION }}

      - name: Create GitHub Release & Attach Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/pidatapipeline-v${{ steps.get_version.outputs.VERSION }}.zip
            dist/pidatapipeline-v${{ steps.get_version.outputs.VERSION }}.zip.sha256
