name: Package & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.5)'
        required: true
        default: '1.0.5'

jobs:
  release:
    name: Build & Publish Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Tag Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build Standard & Offline Packages
        run: |
          python package_release.py --version ${{ steps.get_version.outputs.VERSION }} --no-push
          python build_offline_package.py --version ${{ steps.get_version.outputs.VERSION }}

      - name: Create GitHub Release & Attach Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/PIDataPipeline-App-v${{ steps.get_version.outputs.VERSION }}.zip
            dist/PIDataPipeline-App-v${{ steps.get_version.outputs.VERSION }}.zip.sha256
            dist/pidatapipeline-v${{ steps.get_version.outputs.VERSION }}.zip
            dist/pidatapipeline-v${{ steps.get_version.outputs.VERSION }}.zip.sha256
            dist/PIDataPipeline-Portable-v${{ steps.get_version.outputs.VERSION }}-win64.zip
            dist/PIDataPipeline-Portable-v${{ steps.get_version.outputs.VERSION }}-win64.zip.sha256
            dist/PIDataPipeline-Offline-Wheels-v${{ steps.get_version.outputs.VERSION }}.zip
            dist/PIDataPipeline-Offline-Wheels-v${{ steps.get_version.outputs.VERSION }}.zip.sha256
